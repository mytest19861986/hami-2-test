services:
  db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hamayat_card}
      POSTGRES_USER: ${POSTGRES_USER:-hamayat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set to a non-public local/test secret}
      ALLOW_DEV_OTP_CODE: ${ALLOW_DEV_OTP_CODE:-false}
      AUDIT_AUTHORIZATION_EVENT_MODE: CANONICAL
      DATABASE_URL: postgresql://${POSTGRES_USER:-hamayat}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-hamayat_card}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/api/v1/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment: {PORT: 3000}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ | grep -q 'حمایت کارت'"]
      interval: 10s
      timeout: 5s
      retries: 10
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports: ["8080:80"]
    volumes: ["./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, web]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ | grep -q 'حمایت کارت'"]
      interval: 10s
      timeout: 5s
      retries: 10
